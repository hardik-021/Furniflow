<!DOCTYPE html>
<html>
<head>
<title>Classic Furniture Store</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f1ea;
font-family:"Times New Roman", serif;
}

.navbar{
background:#5a3e2b;
}

.navbar-brand{
color:white !important;
font-weight:bold;
}

.hero{
background:url("https://images.unsplash.com/photo-1616486338812-3dadae4b4ace") center/cover;
height:350px;
display:flex;
align-items:center;
justify-content:center;
color:white;
text-shadow:2px 2px 5px black;
}

.card:hover{
transform:scale(1.05);
transition:0.3s;
}

.btn-classic{
background:#5a3e2b;
color:white;
}

.btn-classic:hover{
background:#3e2a1d;
color:white;
}

.login-box{
max-width:400px;
margin:auto;
margin-top:80px;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

.hidden{
display:none;
}

.add-box{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
margin-bottom:20px;
}

</style>

</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
<div class="login-box">

<h3 class="text-center">Login</h3>

<input type="text" id="loginUser" class="form-control mt-3" placeholder="Username">

<input type="password" id="loginPass" class="form-control mt-3" placeholder="Password">

<button onclick="login()" class="btn btn-classic mt-3 w-100">
Login
</button>

<p class="text-center mt-3">
<a href="#" onclick="showRegister()">Create Account</a>
</p>


</div>
</div>


<!-- REGISTER PAGE -->
<div id="registerPage" class="hidden">
<div class="login-box">

<h3 class="text-center">Register</h3>

<input type="text" id="regUser" class="form-control mt-3" placeholder="Username">

<input type="password" id="regPass" class="form-control mt-3" placeholder="Password">

<button onclick="register()" class="btn btn-success mt-3 w-100">
Register
</button>

<button onclick="showLogin()" class="btn btn-secondary mt-2 w-100">
Back
</button>

</div>
</div>


<!-- STORE PAGE -->
<div id="storePage" class="hidden">

<nav class="navbar navbar-expand-lg">
<div class="container">

<span class="navbar-brand">Classic Furniture Store</span>

<div>

<button class="btn btn-warning me-2" onclick="toggleAddFurniture()">
Add Furniture
</button>

<button class="btn btn-light me-2" onclick="showCart()">
Cart 🛒 (<span id="cartCount">0</span>)
</button>

<button class="btn btn-danger" onclick="logout()">
Logout
</button>

</div>

</div>
</nav>


<div class="hero">
<h1>Elegant Classic Furniture</h1>
</div>


<div class="container mt-4">

<div id="addFurnitureBox" class="add-box hidden">

<h4>Add New Furniture</h4>

<input type="text" id="fName" class="form-control mt-2" placeholder="Furniture Name">

<input type="number" id="fPrice" class="form-control mt-2" placeholder="Price">

<input type="text" id="fImage" class="form-control mt-2" placeholder="Image URL">

<button onclick="addFurniture()" class="btn btn-success mt-3">
Add Furniture
</button>

</div>


<div id="shopPage">

<h2>Furniture Collection</h2>

<div class="row" id="productList"></div>

</div>


<div id="cartPage" class="hidden">

<h2>Your Cart</h2>

<div id="cartItems"></div>

<h4>Total: ₹<span id="totalPrice">0</span></h4>

<button onclick="buyNow()" class="btn btn-success mt-3">
Buy Now
</button>

<button onclick="showShop()" class="btn btn-secondary mt-3">
Back
</button>

</div>

</div>

</div>


<script>

// USERS
function register(){

localStorage.setItem("user",regUser.value);
localStorage.setItem("pass",regPass.value);

alert("Registered Successfully");
showLogin();

}

function login(){

if(loginUser.value==localStorage.getItem("user") &&
loginPass.value==localStorage.getItem("pass")){

showStore();

}else{

alert("Invalid Login");

}

}

function logout(){
showLogin();
}


// PAGE CONTROL
function showLogin(){
loginPage.classList.remove("hidden");
registerPage.classList.add("hidden");
storePage.classList.add("hidden");
}

function showRegister(){
loginPage.classList.add("hidden");
registerPage.classList.remove("hidden");
}

function showStore(){

loginPage.classList.add("hidden");
registerPage.classList.add("hidden");
storePage.classList.remove("hidden");

loadProducts();
displayProducts();
updateCartCount();

}

// ADD FURNITURE
function addFurniture(){

let name=fName.value;
let price=fPrice.value;
let image=fImage.value;

if(name=="" || price=="" || image==""){
alert("Fill all fields");
return;
}

products.push({
name:name,
price:Number(price),
image:image
});

localStorage.setItem("products",JSON.stringify(products));

displayProducts();

alert("Furniture Added Successfully");

fName.value="";
fPrice.value="";
fImage.value="";

}


// DISPLAY PRODUCTS
function displayProducts(){

let html="";

products.forEach((p,index)=>{

html+=`

<div class="col-md-3 mt-4">

<div class="card">

<img src="${p.image}" height="200">

<div class="card-body">

<h5>${p.name}</h5>

<p>₹${p.price}</p>

<button onclick="addToCart(${index})"
class="btn btn-classic w-100">

Add to Cart

</button>

</div>

</div>

</div>

`;

});

productList.innerHTML=html;

}


// TOGGLE FORM
function toggleAddFurniture(){
addFurnitureBox.classList.toggle("hidden");
}


// CART
let cart=JSON.parse(localStorage.getItem("cart")) || [];

function addToCart(index){

cart.push(products[index]);

localStorage.setItem("cart",JSON.stringify(cart));

updateCartCount();

alert("Added to Cart");

}

function updateCartCount(){
cartCount.innerText=cart.length;
}

function showCart(){
shopPage.classList.add("hidden");
cartPage.classList.remove("hidden");
displayCart();
}

function showShop(){
shopPage.classList.remove("hidden");
cartPage.classList.add("hidden");
}

function displayCart(){

let html="";
let total=0;

cart.forEach((item,index)=>{

total+=item.price;

html+=`
<div class="d-flex justify-content-between border p-2 mb-2">
<span>${item.name}</span>
<span>₹${item.price}</span>
<button onclick="removeCart(${index})"
class="btn btn-danger btn-sm">
Remove
</button>
</div>
`;

});

cartItems.innerHTML=html;
totalPrice.innerText=total;

}

function removeCart(index){

cart.splice(index,1);

localStorage.setItem("cart",JSON.stringify(cart));

displayCart();
updateCartCount();

}

function buyNow(){

if(cart.length==0){
alert("Cart is Empty");
return;
}

alert("Purchase Successfully");

cart=[];

localStorage.removeItem("cart");

displayCart();
updateCartCount();

showShop();

}
